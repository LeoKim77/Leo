<title>천하결전 전투 설계서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 왼쪽 목차(카테고리) + 오른쪽 본문(규정 → 자료 → 게시판). 좁은 화면에선 목차가 위쪽 선택 상자로 바뀐다 */
:root {
  --bg: #eef1ef; --panel: #ffffff; --fg: #1a201e; --muted: #5a6561; --line: #d3dbd7; --soft: #f6f8f7;
  --accent: #27695d; --accent-soft: #dcebe6;
  --ok: #2c7443; --ok-bg: #e2f1e6; --rec: #2b5f9e; --rec-bg: #e2ebf7; --prov: #9a6110; --prov-bg: #f7ecd9;
  --need: #a8352a; --need-bg: #f7e1de; --ref: #66706c; --ref-bg: #eceeed;
  --f-display: "Noto Serif KR", "Nanum Myeongjo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111614; --panel: #181e1c; --fg: #e2e8e5; --muted: #98a39e; --line: #2c3532; --soft: #1d2421;
  --accent: #6cbcaa; --accent-soft: #1f3530;
  --ok: #7fcf96; --ok-bg: #1d3325; --rec: #8db6ec; --rec-bg: #1c2a3d; --prov: #e3b062; --prov-bg: #3a2c16;
  --need: #f0968b; --need-bg: #3d211d; --ref: #a6b0ac; --ref-bg: #252c29; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111614; --panel: #181e1c; --fg: #e2e8e5; --muted: #98a39e; --line: #2c3532; --soft: #1d2421;
  --accent: #6cbcaa; --accent-soft: #1f3530;
  --ok: #7fcf96; --ok-bg: #1d3325; --rec: #8db6ec; --rec-bg: #1c2a3d; --prov: #e3b062; --prov-bg: #3a2c16;
  --need: #f0968b; --need-bg: #3d211d; --ref: #a6b0ac; --ref-bg: #252c29; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.shell { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }
nav.side { border-right: 1px solid var(--line); background: var(--panel); padding: 20px 14px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; }
.brand { font-family: var(--f-display); font-size: 19px; font-weight: 700; line-height: 1.3; margin: 0 0 4px; }
.brand-sub { color: var(--muted); font-size: 12.5px; margin-bottom: 16px; }
.nav-group { font-size: 11.5px; letter-spacing: .06em; color: var(--muted); margin: 16px 6px 6px; }
.nav-link { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: var(--fg); text-decoration: none; font-size: 14px; }
.nav-link:hover { background: var(--soft); }
.nav-link.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-count { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; }
.nav-count .open { color: var(--need); }
.mobile-nav { display: none; }
main { padding-block: 28px 64px; padding-inline: 32px; max-width: 1180px; width: 100%; min-width: 0; }
h1 { font-family: var(--f-display); font-size: 28px; line-height: 1.3; margin: 0 0 6px; text-wrap: balance; }
h2 { font-family: var(--f-display); font-size: 20px; margin: 36px 0 12px; text-wrap: balance; }
h3 { font-size: 15px; margin: 22px 0 8px; }
.lead { color: var(--muted); margin: 0 0 18px; max-width: 70ch; }
.meta { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.st-확정, .st-ok { color: var(--ok); background: var(--ok-bg); }
.st-녹화확인 { color: var(--rec); background: var(--rec-bg); }
.st-잠정, .st-approx { color: var(--prov); background: var(--prov-bg); }
.st-결정필요, .st-missing, .st-unsupported { color: var(--need); background: var(--need-bg); }
.st-참고, .st-note, .st-special { color: var(--ref); background: var(--ref-bg); }
.t-공지 { color: var(--accent); border-color: var(--accent); }
.t-결정 { color: var(--ok); border-color: var(--ok); }
.t-질문 { color: var(--need); border-color: var(--need); }
.t-검증요청 { color: var(--rec); border-color: var(--rec); }
.t-변경 { color: var(--prov); border-color: var(--prov); }
.p-열림 { color: var(--need); background: var(--need-bg); }
.p-답변됨 { color: var(--rec); background: var(--rec-bg); }
.p-시뮬반영, .p-닫힘 { color: var(--ok); background: var(--ok-bg); }
.ref { font-family: var(--f-mono); font-size: 12px; color: var(--muted); background: var(--soft); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; text-decoration: none; }
a.ref:hover { color: var(--accent); border-color: var(--accent); }
/* 규정 목록 */
.spec-group { font-size: 12.5px; color: var(--muted); letter-spacing: .04em; margin: 18px 0 6px; }
.spec { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 4px 14px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.spec + .spec { margin-top: 6px; }
.spec-id { font-family: var(--f-mono); font-size: 13px; color: var(--muted); padding-top: 1px; }
.spec-title { font-weight: 600; }
.spec-rule { grid-column: 2 / 4; white-space: pre-wrap; }
.spec-foot { grid-column: 2 / 4; font-size: 13px; color: var(--muted); }
.spec-foot details summary { cursor: pointer; }
/* 상태 막대: 구간마다 개수를 늘 표시 */
.bar { display: flex; height: 26px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--panel); border: 1px solid var(--line); padding: 2px; }
.bar > div { display: flex; align-items: center; justify-content: center; font-family: var(--f-mono); font-size: 12px; font-weight: 600; min-width: 26px; border-radius: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
/* 게시판 */
.post { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.post-title { font-weight: 600; font-size: 15.5px; }
.post-body { white-space: pre-wrap; margin: 8px 0 0; max-width: 78ch; }
.ask { margin: 10px 0 0; padding: 10px 12px; border-left: 3px solid var(--need); background: var(--need-bg); border-radius: 0 6px 6px 0; }
.ask ol { margin: 4px 0 0; padding-left: 20px; }
.answer { margin: 10px 0 0; padding: 10px 12px; border-left: 3px solid var(--ok); background: var(--ok-bg); border-radius: 0 6px 6px 0; white-space: pre-wrap; }
/* 표 */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--soft); position: sticky; top: 0; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mono { font-family: var(--f-mono); font-size: 12.5px; }
.dim { color: var(--muted); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
input[type=search], select { font: inherit; font-size: 14px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; padding: 5px 10px; border: 0; background: var(--panel); color: var(--fg); cursor: pointer; }
.seg button.on { background: var(--accent); color: var(--panel); }
details.item { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
details.item + details.item { margin-top: 6px; }
details.item summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.clause { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; padding: 4px 0; font-size: 13.5px; }
/* 용어 카드 */
.term { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.term-name { font-family: var(--f-display); font-size: 18px; font-weight: 700; }
.term-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 8px; }
.term-label { font-size: 11.5px; letter-spacing: .06em; color: var(--muted); margin-bottom: 2px; }
.engine-box { margin: 8px 0; padding: 8px 10px; background: var(--soft); border: 1px solid var(--line); border-radius: 6px; }
/* 무장 카드 */
.gen-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; align-items: start; }
.gen { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.gen summary { cursor: pointer; list-style: none; }
.gen summary::-webkit-details-marker { display: none; }
.gen-name { font-size: 16px; }
.gen-body { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; font-size: 13.5px; }
.stat-bars { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
.stat-row, .form-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) 44px; gap: 8px; align-items: center; font-size: 12.5px; }
.stat-k { color: var(--muted); }
.stat-track { height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.stat-fill { display: block; height: 100%; border-radius: 4px; }
.s-무력 { background: var(--need); } .s-지력 { background: var(--rec); } .s-통솔 { background: var(--ok); } .s-선공 { background: var(--prov); }
.stat-v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
/* 진형 카드 */
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.form { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 5px; }
.form-name { font-family: var(--f-display); font-size: 17px; font-weight: 700; margin-bottom: 2px; }
.form-traits { margin-top: 6px; font-size: 13.5px; display: flex; flex-direction: column; gap: 4px; }
/* 녹화 계획 */
.battle { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.battle-no { font-family: var(--f-mono); color: var(--accent); font-weight: 600; }
.checks { margin: 0; padding-left: 20px; font-size: 13.5px; display: flex; flex-direction: column; gap: 4px; }
/* 개요: 전투 흐름 */
.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; counter-reset: step; }
.step { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.step-no { font-family: var(--f-mono); font-size: 12px; color: var(--accent); }
.step-title { font-weight: 600; margin: 2px 0 4px; }
.step ul { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--muted); }
.formula { font-family: var(--f-mono); font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; white-space: pre; }
.empty { color: var(--muted); padding: 14px; border: 1px dashed var(--line); border-radius: 8px; }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  nav.side { display: none; }
  .mobile-nav { display: flex; flex-direction: column; gap: 6px; padding-block: 14px 0; padding-inline: 16px; }
  .mobile-nav select { width: 100%; }
  main { padding-inline: 16px; }
  .spec { grid-template-columns: minmax(0, 1fr); }
  .spec-rule, .spec-foot { grid-column: 1; }
  .term-cols { grid-template-columns: minmax(0, 1fr); }
  h1 { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="shell">
  <nav class="side" id="side" aria-label="카테고리"></nav>
  <div style="min-width:0">
    <div class="mobile-nav"><div class="brand">천하결전 전투 설계서</div><label class="meta" for="mnav">카테고리</label><select id="mnav"></select></div>
    <main id="main"></main>
  </div>
</div>

<script>
const D = /*__DESIGN_DATA__*/null;
const STATUS = ['확정', '녹화확인', '잠정', '결정필요', '참고'];
const STATUS_LABEL = { 확정: '확정', 녹화확인: '녹화 확인', 잠정: '잠정', 결정필요: '결정 필요', 참고: '참고' };
const CLAUSE_LABEL = { ok: '원문대로', approx: '근사', missing: '미반영', note: '설명', special: '특수', unsupported: '미지원' };
const POST_TYPES = ['공지', '결정', '질문', '검증요청', '변경'];

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
const catById = Object.fromEntries(D.categories.map(c => [c.id, c]));
const specById = Object.fromEntries(D.spec.map(s => [s.id, s]));
const specOf = id => D.spec.filter(s => s.cat === id);
const postsOf = id => D.posts.filter(p => p.cat === id).sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
const isOpen = p => p.status === '열림';
const chip = (cls, txt) => h('span', { class: `chip ${cls}` }, txt);
const stChip = s => chip(`st-${s}`, STATUS_LABEL[s] || s);
const specRef = id => specById[id] ? h('a', { class: 'ref', href: `#c-${specById[id].cat}`, title: specById[id].title }, id) : h('span', { class: 'ref' }, id);
const ruleRef = r => h('a', { class: 'ref', href: '#c-decisions', title: (D.rules.find(x => x.id === r) || {}).statement || '' }, r);

function statusBar(items) {
  const n = s => items.filter(x => x.status === s).length;
  const total = items.length || 1;
  const segs = STATUS.filter(s => n(s));
  return h('div', null,
    h('div', { class: 'bar', role: 'img', 'aria-label': segs.map(s => `${STATUS_LABEL[s]} ${n(s)}`).join(', ') },
      segs.map(s => h('div', { class: `st-${s}`, style: `flex:${n(s) / total}` }, n(s)))),
    h('div', { class: 'legend' }, segs.map(s => h('span', null, stChip(s), ` ${n(s)}개`))));
}

function renderSpec(items) {
  if (!items.length) return h('div', { class: 'empty' }, '이 카테고리에 규정이 아직 없습니다. 대화에서 정하면 여기에 추가됩니다.');
  const groups = [...new Set(items.map(s => s.group))];
  return h('div', null, groups.map(g => [
    h('div', { class: 'spec-group' }, g),
    items.filter(s => s.group === g).map(s => h('div', { class: 'spec', id: `s-${s.id}` },
      h('div', { class: 'spec-id' }, s.id),
      h('div', { class: 'spec-title' }, s.title),
      h('div', null, stChip(s.status)),
      h('div', { class: 'spec-rule' }, s.rule),
      (s.basis?.length || s.note || s.history?.length > 1) ? h('div', { class: 'spec-foot' },
        h('div', { class: 'row' }, (s.basis || []).map(ruleRef), s.note && s.note !== s.basis?.join('·') ? h('span', null, s.note) : null),
        s.history?.length > 1 ? h('details', null, h('summary', null, `변경 ${s.history.length - 1}건`), h('ul', null, s.history.map(x => h('li', null, `${x.date} ${x.change}${x.post ? ` (${x.post})` : ''}`)))) : null) : null)),
  ]));
}

function renderPost(p) {
  return h('article', { class: 'post', id: `p-${p.id}` },
    h('div', { class: 'row' }, chip(`t-${p.type}`, p.type), chip(`p-${p.status.replace(/\s/g, '')}`, p.status),
      h('span', { class: 'meta' }, `${p.id} · ${p.date} · ${catById[p.cat]?.title || p.cat}`)),
    h('div', { class: 'post-title', style: 'margin-top:6px' }, p.title),
    h('div', { class: 'post-body' }, p.body),
    p.ask?.length ? h('div', { class: 'ask' }, h('strong', null, isOpen(p) ? '답변이 필요한 것' : '물었던 것'), h('ol', null, p.ask.map(a => h('li', null, a)))) : null,
    p.answer ? h('div', { class: 'answer' }, h('strong', null, '결정 '), p.answer) : null,
    (p.specIds?.length || p.rules?.length) ? h('div', { class: 'row', style: 'margin-top:10px' }, h('span', { class: 'meta' }, '관련'), (p.specIds || []).map(specRef), (p.rules || []).map(ruleRef)) : null);
}

function postBoard(posts, opts = {}) {
  const wrap = h('div');
  let type = '전체', onlyOpen = !!opts.onlyOpen;
  const draw = () => {
    const list = posts.filter(p => (type === '전체' || p.type === type) && (!onlyOpen || isOpen(p)));
    wrap.replaceChildren(
      h('div', { class: 'toolbar' },
        h('div', { class: 'seg', role: 'group', 'aria-label': '게시글 종류' }, ['전체', ...POST_TYPES].map(t => h('button', { class: t === type ? 'on' : '', onclick: () => { type = t; draw(); } }, t))),
        h('div', { class: 'seg' }, h('button', { class: onlyOpen ? 'on' : '', onclick: () => { onlyOpen = !onlyOpen; draw(); } }, '열린 글만'))),
      list.length ? h('div', { class: 'stack' }, list.map(renderPost)) : h('div', { class: 'empty' }, '해당하는 게시글이 없습니다.'));
  };
  draw();
  return wrap;
}

function table(cols, rows, opts = {}) {
  return h('div', { class: 'table-wrap', style: opts.maxH ? `max-height:${opts.maxH}px` : null },
    h('table', null, h('thead', null, h('tr', null, cols.map(c => h('th', { class: c.num ? 'num' : '' }, c.label)))),
      h('tbody', null, rows.map(r => h('tr', null, cols.map(c => h('td', { class: c.num ? 'num' : (c.mono ? 'mono' : '') }, c.get(r))))))));
}

function searchable(placeholder, render, extra) {
  const box = h('div');
  const input = h('input', { type: 'search', placeholder, id: `q-${placeholder.length}`, 'aria-label': placeholder });
  const out = h('div');
  const go = () => out.replaceChildren(render(input.value.trim()));
  input.addEventListener('input', go);
  box.append(h('div', { class: 'toolbar' }, input, extra ? extra(go) : null), out);
  go();
  return box;
}

/* ---------- 카테고리별 자료 ---------- */
const TERM_CATS = ['능력치', '전법 종류', '피해 종류', '기본 버프', '기능성 버프', '비제어 이상 상태', '제어 이상 상태', '디버프 상태·표식', '조합', '전장 용어'];
function termCard(t) {
  return h('article', { class: 'term', id: `t-${t.term}` },
    h('div', { class: 'row' }, h('span', { class: 'term-name' }, t.term), chip('t-공지', t.cat), stChip(t.status),
      t.uses ? h('span', { class: 'meta' }, `전법·금병법 ${t.users.length}개가 사용`) : null),
    h('div', { class: 'term-cols' },
      h('div', null, h('div', { class: 'term-label' }, '게임 설명'), h('div', null, t.game || '—')),

        m.clauses.map(c => h('div', { class: 'clause' }, chip(`st-${c.status}`, CLAUSE_LABEL[c.status] || c.status), h('div', null, c.text))),
        m.note ? h('p', { class: 'dim' }, `엔진 메모: ${m.note}`) : null,
        m.revised.length ? h('div', { class: 'dim', style: 'font-size:12.5px' }, h('strong', null, '원문 대조 수정'), h('ul', null, m.revised.map(r => h('li', null, r)))) : null)));
    });
  },
  verification() {
    const V = D.verification;
    const qOpen = V.queue.filter(x => !['verified', 'resolved', 'done'].includes(x.status));
    const kinds = {}; qOpen.forEach(x => { kinds[x.kind] = (kinds[x.kind] || 0) + 1; });
    return h('div', null,
      V.audit ? h('div', null, h('h3', null, `규칙 감사 (${V.audit.generatedAt.slice(0, 10)})`),
        table([{ label: '결과', get: r => r[0] }, { label: '개수', num: true, get: r => r[1] }], [['통과', V.audit.summary.pass], ['경고', V.audit.summary.warn], ['실패', V.audit.summary.fail], ['생략', V.audit.summary.skip]])) : null,
      h('h3', null, '전보 역재현 결과'),
      V.replays.map(r => h('details', { class: 'item' }, h('summary', null, h('strong', null, r.id), h('span', { class: 'meta' }, `표본 ${r.samples}건 · 오차 RMS ${r.rms ?? '—'}%`)),
        table([{ label: '턴', num: true, get: x => x.turn }, { label: '항목', get: x => x.label }, { label: '실측', num: true, get: x => x.observed }, { label: '엔진', num: true, get: x => x.predicted }, { label: '오차', num: true, get: x => `${x.errPct > 0 ? '+' : ''}${x.errPct}%` }], r.rows, { maxH: 420 }))),
      h('h3', null, `엔진 가정 (녹화로 확인할 것) ${V.assumptions.length}건`),
      table([{ label: '항목', get: a => h('strong', null, a.title) }, { label: '지금 가정', get: a => a.assumption }, { label: '확인 방법', get: a => a.howToVerify }], V.assumptions, { maxH: 520 }),
      planView(),
      h('h3', null, `검증 대기열 ${qOpen.length}건 (종류별)`),
      table([{ label: '종류', get: r => r[0] }, { label: '대기', num: true, get: r => r[1] }], Object.entries(kinds).sort((a, b) => b[1] - a[1])));
  },
  decisions() {
    return searchable('확정 규칙 검색', q => table([{ label: '번호', mono: true, get: r => r.id }, { label: '날짜', mono: true, get: r => r.date }, { label: '주제', get: r => h('strong', null, r.topic) }, { label: '내용', get: r => r.statement }],
      [...D.rules].reverse().filter(r => !q || [r.id, r.topic, r.statement].join(' ').includes(q)), { maxH: 640 }));
  },
  log() {
    return h('div', null, h('h3', null, `변경 게시판 ${D.changelog.length}건`),
      searchable('변경 기록 검색', q => h('div', null, D.changelog.filter(c => !q || [c.title, c.body].join(' ').includes(q)).slice(0, 80).map(c => h('details', { class: 'item' },
        h('summary', null, h('span', { class: 'meta' }, c.date), chip('t-변경', c.category), h('strong', null, c.title), c.commit ? h('span', { class: 'meta' }, c.commit.slice(0, 8)) : null),
        h('div', { class: 'post-body' }, c.body), c.files?.length ? h('div', { class: 'meta', style: 'margin-top:6px' }, c.files.join(' · ')) : null)))),
      h('h3', null, `엔진 수정 내역 ${D.engineFixes.length}건`),
      table([{ label: '번호', mono: true, get: f => f.id }, { label: '날짜', mono: true, get: f => f.date }, { label: '제목', get: f => h('strong', null, f.title) }, { label: '내용', get: f => f.detail }], [...D.engineFixes].sort((a, b) => b.date.localeCompare(a.date)), { maxH: 560 }));
  },
};

/* ---------- 화면 ---------- */
function renderNav(active) {
  const side = document.getElementById('side');
  const openAll = D.posts.filter(isOpen).length;
  const link = (href, label, right, on) => h('a', { class: `nav-link${on ? ' active' : ''}`, href }, h('span', null, label), right);
  side.replaceChildren(
    h('div', { class: 'brand' }, '천하결전 전투 설계서'),
    h('div', { class: 'brand-sub' }, `시뮬레이션 기획·규정 · ${D.builtAt.slice(0, 10)}`),
    link('#home', '처음 · 전체 흐름', null, active === 'home'),
    link('#open', '답변·녹화 필요', h('span', { class: 'nav-count' }, h('span', { class: 'open' }, openAll)), active === 'open'),
    link('#board', '전체 게시판', h('span', { class: 'nav-count' }, D.posts.length), active === 'board'),
    h('div', { class: 'nav-group' }, '카테고리'),
    ...D.categories.filter(c => c.id !== 'overview').map(c => {
      const n = specOf(c.id).length, o = postsOf(c.id).filter(isOpen).length;
      return link(`#c-${c.id}`, c.title, h('span', { class: 'nav-count' }, n ? h('span', null, n) : null, o ? h('span', { class: 'open' }, `?${o}`) : null), active === c.id);
    }));
  const m = document.getElementById('mnav');
  m.replaceChildren(h('option', { value: 'home' }, '처음 · 전체 흐름'), h('option', { value: 'open' }, `답변·녹화 필요 (${openAll})`), h('option', { value: 'board' }, '전체 게시판'),
    ...D.categories.filter(c => c.id !== 'overview').map(c => h('option', { value: `c-${c.id}` }, c.title)));
  m.value = active === 'home' || active === 'open' || active === 'board' ? active : `c-${active}`;
  m.onchange = () => { location.hash = m.value; };
}

function renderCategory(id) {
  const c = catById[id];
  const spec = specOf(id), posts = postsOf(id);
  const view = DATA_VIEWS[id];
  return [
    h('div', { class: 'meta' }, '카테고리'),
    h('h1', null, c.title), h('p', { class: 'lead' }, c.desc),
    spec.length ? statusBar(spec) : null,
    spec.length ? [h('h2', null, `규정 ${spec.length}개`), renderSpec(spec)] : null,
    view ? [h('h2', null, '자료'), view()] : null,
    h('h2', null, `게시판 ${posts.length}건`), postBoard(posts),
  ];
}

function route() {
  const hash = location.hash.replace(/^#/, '') || 'home';
  const main = document.getElementById('main');
  let active = 'home', body;
  if (hash === 'home' || hash === 'c-overview') {
    const ov = catById.overview;
    body = [h('div', { class: 'meta' }, `데이터 ${D.dataVersion} · 규정 ${D.spec.length}개 · 게시글 ${D.posts.length}개 · 무장 ${D.game.generals.length} · 전법 ${D.game.skills.length} · 금병법 ${D.game.manuals.length}`),
      h('h1', null, '천하결전 전투 설계서'), h('p', { class: 'lead' }, '삼국지 천하결전 전투 시뮬레이션이 작동하는 방법과 결과에 영향을 주는 모든 요소를 규정한다. 시뮬레이션 사이트는 여기 규정만 구현한다. 대화에서 결정한 내용이 이 페이지의 규정과 게시글로 반영된다.'),
      statusBar(D.spec),
      h('h2', null, `기본 규정 ${specOf('overview').length}개`), renderSpec(specOf('overview')),
      DATA_VIEWS.overview(),
      h('h2', null, '개요 게시판'), postBoard(postsOf('overview'))];
  } else if (hash === 'open') {
    active = 'open';
    const open = D.posts.filter(isOpen);
    body = [h('h1', null, '답변·녹화가 필요한 것'), h('p', { class: 'lead' }, '질문은 대화에서 답해 주면 규정에 반영한다. 검증요청은 녹화·캡처가 오면 역재현으로 계수를 맞춘다.'),
      h('h2', null, `질문 ${open.filter(p => p.type === '질문').length}건`), h('div', { class: 'stack' }, open.filter(p => p.type === '질문').map(renderPost)),
      h('h2', null, `검증요청 ${open.filter(p => p.type === '검증요청').length}건`), h('div', { class: 'stack' }, open.filter(p => p.type === '검증요청').map(renderPost)),
      h('h2', null, '녹화 계획'), planView()];
  } else if (hash === 'board') {
    active = 'board';
    body = [h('h1', null, '전체 게시판'), h('p', { class: 'lead' }, '모든 카테고리의 게시글. 결정·질문·검증요청·변경이 날짜순으로 쌓인다.'),
      postBoard([...D.posts].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id)))];
  } else if (hash.startsWith('c-') && catById[hash.slice(2)]) {
    active = hash.slice(2);
    body = renderCategory(active);
  } else if (hash.startsWith('p-')) {
    const p = D.posts.find(x => x.id === hash.slice(2));
    active = p ? p.cat : 'home';
    body = p ? [h('a', { href: `#c-${p.cat}` }, `← ${catById[p.cat]?.title}`), h('div', { style: 'margin-top:12px' }, renderPost(p))] : [h('div', { class: 'empty' }, '게시글을 찾을 수 없습니다.')];
  } else body = [h('div', { class: 'empty' }, '페이지를 찾을 수 없습니다.')];
  renderNav(active);
  main.replaceChildren(...[body].flat(Infinity).filter(Boolean));
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
