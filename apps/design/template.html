  --accent: #6cbcaa; --accent-soft: #1f3530;
  --ok: #7fcf96; --ok-bg: #1d3325; --rec: #8db6ec; --rec-bg: #1c2a3d; --prov: #e3b062; --prov-bg: #3a2c16;

<script>
const D = /*__DESIGN_DATA__*/null;
const STATUS = ['확정', '녹화확인', '잠정', '결정필요', '참고'];
const STATUS_LABEL = { 확정: '확정', 녹화확인: '녹화 확인', 잠정: '잠정', 결정필요: '결정 필요', 참고: '참고' };
const CLAUSE_LABEL = { ok: '원문대로', approx: '근사', missing: '미반영', note: '설명', special: '특수', unsupported: '미지원' };
const POST_TYPES = ['공지', '결정', '질문', '검증요청', '검증완료', '변경'];

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);

/* ---------- 점검 · 기획 · 설계 · 검증 ---------- */
const DB = D.dashboard;

const spaceOf = page => (SPACES.find(s => s.pages.some(p => p[0] === page)) || SPACES[0]);

function renderNav(active) {
  const side = document.getElementById('side');
  const sp = spaceOf(active);
  const openAll = D.posts.filter(isOpen).length;
  const badge = { 'plan-open': DB.cards.questions.count, 'v-decks': DB.cards.engine.count, 'v-clauses': DB.cards.clauses.count, 'board': D.posts.length };
  const link = (href, label, on, n, warn) => h('a', { class: `nav-link${on ? ' active' : ''}`, href: `#${href}` }, h('span', null, label), n != null ? h('span', { class: 'nav-count' }, h('span', { class: warn ? 'open' : '' }, n)) : null);
  side.replaceChildren(...[
    h('div', { class: 'brand' }, '천하결전 전투 설계서'),
    h('div', { class: 'brand-sub' }, `기획 · 설계 · 검증 · ${D.builtAt.slice(0, 10)}`),
    ...SPACES.map(s => [
      h('div', { class: 'nav-group' }, s.title),
      s.pages.map(([id, label]) => {
        const cat = id.startsWith('c-') ? id.slice(2) : null;
        const o = cat ? postsOf(cat).filter(isOpen).length : 0;
        return link(id, label, id === active, badge[id] ?? (o ? `?${o}` : null), id === 'plan-open' || id === 'v-decks' || o > 0);
      }),
    ])].flat(Infinity));
  const tabs = document.getElementById('mtabs');
  tabs.replaceChildren(...SPACES.map(s => h('a', { href: `#${s.pages[0][0]}`, class: s === sp ? 'on' : '' }, s.title)));
  const m = document.getElementById('mnav');
  m.replaceChildren(...sp.pages.map(([id, label]) => h('option', { value: id }, label)));
  m.value = active;
  m.onchange = () => { location.hash = m.value; };
  void openAll;
}

/* 녹화할 덱 */
function deckText(d) {
  const u = x => `${x.name}(${x.skills.map(s => s.name).join('·')}${x.manual ? `, 〈${x.manual.name}〉` : ''})`;
  return `${d.no}판 ${d.title} | ${d.formation} | 전열: ${d.units.filter(x => x.position === '전열').map(u).join(', ')} | 후열: ${d.units.filter(x => x.position !== '전열').map(u).join(', ')} | 상대: ${d.opponent}`;
}
function copyBtn(text) {
