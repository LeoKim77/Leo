  function runSimulation() {
    const army = state.armies.find(a => a.id === state.sim.myArmyId);
    const td = tierDeckById[state.sim.opponentTierDeckId];
    if (!army || !army.units.filter(Boolean).length) { alert('부대에 무장을 최소 1명 이상 배치해주세요.'); return; }
    const freshPair = () => [armyToUnits(army, 'A'), tierDeckToUnits(td, 'B')];

    // 진행률 표시 — runMonteCarlo는 동기 실행이라 도는 동안 화면이 멈춘다.
    // 진행바를 먼저 그려 브라우저가 한 번 렌더링하게 한 뒤(setTimeout 0), 실제 계산을 시작한다.
    const box = document.getElementById('sim-results');
    box.innerHTML = '';
    const bar = el('div', { class: 'sim-progress' }, [
      el('div', { class: 'sim-progress-label' }, [`시뮬레이션 실행 중… ${state.sim.runs}판 계산하고 있습니다.`]),
      el('div', { class: 'sim-progress-track' }, [el('div', { class: 'sim-progress-fill' }, [])]),
    ]);
    box.appendChild(bar);
    const fill = bar.querySelector('.sim-progress-fill');
    const label = bar.querySelector('.sim-progress-label');
    fill.style.width = '30%';

    setTimeout(() => {
      let mc;
      try {
        mc = E.runMonteCarlo(freshPair, state.sim.coeffs, state.sim.runs);
      } catch (err) {
        label.textContent = '오류가 발생해 시뮬을 중단했습니다: ' + err.message;
        fill.style.background = '#8b949e';
        console.error(err);
        return;
      }
      fill.style.width = '100%';
      afterMonteCarlo(mc);
    }, 30);

    const afterMonteCarlo = (mc) => {

    const oppTexts = td.units.flatMap(u => {
      const s1 = skillByName[u.skill1]; const s2 = skillByName[u.skill2];
      const g = generalByName[u.general]; const us = uniqueByGeneralName[g.name];
      return [s1 && s1.raw, s2 && s2.raw, us && us.raw].filter(Boolean);
    });
    const usedNamesA = new Set(army.units.filter(Boolean).flatMap(u => [u.skill1Id, u.skill2Id].map(id => id && skillById[id] && skillById[id].name)).filter(Boolean));
    const myUnusedSkills = D.skills.filter(s => state.ownedSkills.has(s.id) && !usedNamesA.has(s.name));
    const counter = E.recommendCounters(oppTexts, myUnusedSkills);

    state.sim.lastResult = { mc, counter, army, td };
    renderResults(state.sim.lastResult);
    };
  }

  // 전투 목록 (게시판 스타일): 판마다 한 줄 요약, 개수 드롭다운, 클릭 시 상세 모달
  function renderBattleList(mc) {
    const wrap = el('div', { class: 'battle-list-wrap' });
    const controls = el('div', { class: 'battle-list-controls' });
    const countSel = el('select', { class: 'battle-count-sel' });
    [10, 20, 50, '전체'].forEach(n => {
      const val = n === '전체' ? mc.runs : n;
      if (val > mc.runs && n !== '전체') return;
      countSel.appendChild(el('option', { value: String(val), selected: state.sim.listCount === val ? 'selected' : null }, [n === '전체' ? `전체 (${mc.runs}판)` : `최대 ${n}개`]));
    });
    countSel.addEventListener('change', () => { state.sim.listCount = parseInt(countSel.value); renderResults(state.sim.lastResult); });
    controls.appendChild(el('label', null, ['표시 개수: ']));
    controls.appendChild(countSel);
    wrap.appendChild(controls);

    const table = el('div', { class: 'battle-table' });
    table.appendChild(el('div', { class: 'battle-row battle-row-head' }, [
      el('span', { class: 'bc-no' }, ['판']),
      el('span', { class: 'bc-result' }, ['결과']),
      el('span', { class: 'bc-turns' }, ['종료 턴']),
      el('span', { class: 'bc-troops' }, ['최종 병력(아군/적군)']),
    ]));
    const shown = Math.min(state.sim.listCount || 20, mc.results.length);
    for (let i = 0; i < shown; i++) {
      const result = mc.results[i];
      const lastTp = result.troopHistory[result.troopHistory.length - 1] || { A: 0, B: 0 };
      const row = el('div', {
        class: 'battle-row clickable' + (result.winner === 'A' ? ' win' : result.winner === 'B' ? ' lose' : ''),
        onclick: () => openBattleModal(i),
      }, [
        el('span', { class: 'bc-no' }, [`${i + 1}판`]),
        el('span', { class: 'bc-result' }, [result.winner === 'A' ? '승리' : result.winner === 'B' ? '패배' : '무승부']),
        el('span', { class: 'bc-turns' }, [`${result.turns}턴`]),
        el('span', { class: 'bc-troops' }, [`${Math.round(lastTp.A).toLocaleString()} / ${Math.round(lastTp.B).toLocaleString()}`]),
      ]);
      table.appendChild(row);
    }
    wrap.appendChild(table);
    return wrap;
  }

  function renderResults(r) {
    const box = document.getElementById('sim-results');
    box.innerHTML = '';
    const { mc, counter, army, td } = r;

    box.appendChild(el('div', { class: 'result-summary' }, [
      summaryCard('승률', fmtPct(mc.winRateA), mc.winA + '승 ' + mc.winB + '패' + (mc.draw ? ' ' + mc.draw + '무' : '')),
      summaryCard('평균 종료 턴', mc.avgTurns.toFixed(1) + '턴', ''),
      summaryCard('결정적 턴', mc.decisiveTurn ? mc.decisiveTurn + '턴' : '-', '병력 격차 최대 시점'),
    ]));

    box.appendChild(sectionTitle('① 승패 갈림 요인', '선행 이벤트(3턴 내 발동 여부) 기준 — 결과값(딜량 등)은 제외'));
    box.appendChild(barChart(mc.decisiveFactors.map(f => ({ label: f.name, value: f.delta, display: fmtPp(f.delta) })), true));

    box.appendChild(sectionTitle('② 이 덱을 어떻게 고칠까', `상대 특징: ${counter.profile.tags.map(t => t.tag).join(', ') || '뚜렷한 편향 없음'} · 물리 비중 ${fmtPct(counter.profile.physRatio)}`));
    box.appendChild(renderSwapSuggestions(r));

    box.appendChild(sectionTitle('③ 이 상대를 이기는 카운터 덱', '보유 자원으로 구성 가능한 조합을 실제로 시뮬레이션해 뽑았습니다'));
    box.appendChild(renderCounterDeck(r));

    box.appendChild(sectionTitle('④ 전법 기여도', '각 진영 내에서 총 피해+회복 가치 대비 지분(%) — 좌: 아군 / 우: 적군'));
    const contribWrap = el('div', { class: 'contrib-2col' }, [
      el('div', { class: 'contrib-col contrib-ally' }, [
        el('div', { class: 'contrib-head' }, [`아군 — ${r.army ? r.army.name : '내 부대'}`]),
        mc.contribution.length
          ? barChart(mc.contribution.slice(0, 8).map(c => ({ label: c.name, value: c.pct,
              display: `${fmtPct(c.pct)} · ${c.procsPerRun.toFixed(1)}회/판` })), false)
          : el('div', { class: 'empty-note' }, ['기여 데이터 없음']),
      ]),
      el('div', { class: 'contrib-col contrib-enemy' }, [
        el('div', { class: 'contrib-head' }, [`적군 — ${r.td ? r.td.name : '상대'}`]),
        (mc.contributionB && mc.contributionB.length)
          ? barChart(mc.contributionB.slice(0, 8).map(c => ({ label: c.name, value: c.pct,
              display: `${fmtPct(c.pct)} · ${c.procsPerRun.toFixed(1)}회/판` })), false)
          : el('div', { class: 'empty-note' }, ['기여 데이터 없음']),
      ]),
    ]);
    box.appendChild(contribWrap);

    box.appendChild(sectionTitle('⑤ 턴별 병력 흐름', '내 부대 승리 시점 기준 평균 병력 곡선'));
    box.appendChild(lineChart(mc.troopCurveWin.length ? mc.troopCurveWin : mc.troopCurveAll, mc.decisiveTurn));

    box.appendChild(sectionTitle('전투 목록', `${mc.runs}판 전체 결과 — 클릭하면 해당 판의 상세 전황을 볼 수 있습니다`));
    box.appendChild(renderBattleList(mc));

    const promptBtn = el('button', { class: 'btn-primary btn-prompt', onclick: () => copyPrompt(r) }, ['📋 Claude와 이어서 분석하기 (프롬프트 복사)']);
    box.appendChild(promptBtn);

    box.appendChild(el('div', { class: 'disclaimer' }, [
      '⚠️ 이 시뮬레이터는 근사 계수(C/α/β) 기반입니다. 절대 승률 수치보다 구조적 경향(어떤 요인이 승패를 가르는지)에 무게를 두고 참고해주세요.',
    ]));
  }

  function coeffRow(name, def, desc) {
    return el('tr', null, [
      el('td', { class: 'ch-name' }, [name, el('span', { class: 'ch-def' }, [`기본 ${def}`])]),
      el('td', { class: 'ch-desc' }, [desc]),
    ]);
  }


  // ---------------- 카운터 분석 ----------------
  // ② 현재 덱에서 무엇을 바꾸면 좋은가 — 실제로 교체 시뮬을 돌려 승률 변화를 측정
  function renderSwapSuggestions(r) {
    const { army, td, mc } = r;
    const wrap = el('div', { class: 'counter-list' });
    const base = mc.winRateA;
    const contribByName = {};
    mc.contribution.forEach(c => { contribByName[c.name] = c.pct; });

    // 기여도가 낮은 전법 = 교체 후보
    const slots = [];
    army.units.filter(Boolean).forEach((u, ui) => {
      ['skill1Id', 'skill2Id'].forEach(key => {
        if (!u[key]) return;
        const s = skillById[u[key]];
        slots.push({ ui, key, skill: s, general: generalById[u.generalId], pct: contribByName[s.name] || 0 });
      });
    });
    slots.sort((a, b) => a.pct - b.pct);
    const weakest = slots.slice(0, 2);

    // 보유 중 미사용 전법 후보 (상대 특징에 맞는 것 우선)
    const usedIds = new Set(army.units.filter(Boolean).flatMap(u => [u.skill1Id, u.skill2Id]).filter(Boolean));
    const pool = D.skills.filter(s => state.ownedSkills.has(s.id) && !usedIds.has(s.id));

    let found = 0;
    // 전법은 한 무장당 하나만 장착할 수 있고 같은 전법을 두 무장이 나눠 가질 수도 없다.
    // 따라서 먼저 추천된 전법은 다음 슬롯 후보에서 제외한다.
    // 또한 추천은 "함께 적용"을 전제로 하므로, 앞의 교체를 반영한 덱 위에서 다음 교체를 평가한다.
    const takenIds = new Set();
    let workingArmy = JSON.parse(JSON.stringify(army));
    let runningBase = base;
    weakest.forEach(slot => {
      // 같은 역할 계열 위주로 6개만 실제 시뮬 검증 (시간 제약)
      const cands = pool
        .filter(s => !takenIds.has(s.id))
        .filter(s => s.trait === slot.skill.trait || s.grade === '전설')
        .slice(0, 6);
      let best = null;
      cands.forEach(cand => {
        const trial = JSON.parse(JSON.stringify(workingArmy));
        trial.units[slot.ui][slot.key] = cand.id;
        const freshPair = () => [armyToUnits(trial, 'A'), tierDeckToUnits(td, 'B')];
        const m = E.runMonteCarlo(freshPair, state.sim.coeffs, 8);
        if (!best || m.winRateA > best.wr) best = { cand, wr: m.winRateA };
      });
      if (best && best.wr > runningBase + 0.03) {
        found++;
        const delta = best.wr - runningBase;
        const shownBase = runningBase;
        // 이 교체를 확정하고 다음 슬롯은 그 위에서 평가
        takenIds.add(best.cand.id);
        workingArmy.units[slot.ui][slot.key] = best.cand.id;
        runningBase = best.wr;
        wrap.appendChild(el('div', { class: 'counter-item' }, [
          el('div', { class: 'counter-skill' }, [`${slot.general.name}: [${slot.skill.name}] → [${best.cand.name}]`]),
          el('div', { class: 'counter-reason' }, [
            `승률 ${fmtPct(shownBase)} → ${fmtPct(best.wr)} (${(delta * 100).toFixed(1)}%p 상승). `,
            `${slot.skill.name}은(는) 이 매치업에서 기여도가 ${fmtPct(slot.pct)}로 낮았습니다. `,
            `${best.cand.name}은(는) [${best.cand.grade}·${best.cand.type}·${best.cand.trait}] 계열로, ${best.cand.raw.slice(0, 70)}…`,
          ]),
        ]));
      }
    });
    if (found > 1) {
      wrap.appendChild(el('div', { class: 'counter-note' }, [
        'ℹ️ 위 교체안은 서로 겹치지 않으며, 순서대로 함께 적용했을 때의 누적 승률입니다.',
      ]));
    }
    if (!found) {
      wrap.appendChild(el('div', { class: 'empty-note' }, [
        '보유 전법 범위에서 승률을 3%p 이상 끌어올리는 교체를 찾지 못했습니다. 무장 조합 자체를 바꾸는 편이 나을 수 있습니다 (아래 카운터 덱 참고).',
      ]));
    }
    return wrap;
  }

  // ③ 이 상대를 이기는 카운터 덱 — 보유 자원으로 조합을 만들어 이 상대에게만 시뮬
  function renderCounterDeck(r) {
    const { td, army } = r;
    const wrap = el('div', { class: 'counter-list' });
    const res = availableResources(null); // 전체 보유 자원 기준
    if (res.generals.length < 3) {
      wrap.appendChild(el('div', { class: 'empty-note' }, ['보유 무장이 3명 미만이라 카운터 덱을 구성할 수 없습니다.']));
      return wrap;
    }
    const pool = res.generals.slice()
      .sort((a, b) => Math.max(b.stats.무력, b.stats.지력) - Math.max(a.stats.무력, a.stats.지력)).slice(0, 12);
    const combos = [];
    for (let i = 0; i < pool.length; i++)
      for (let j = i + 1; j < pool.length; j++)
        for (let k = j + 1; k < pool.length; k++) combos.push([pool[i], pool[j], pool[k]]);
    combos.sort((a, b) => heuristicTrioScore(b) - heuristicTrioScore(a));
    const shortlist = combos.slice(0, 8);

    let best = null;
    shortlist.forEach(trio => {
      const units = buildCandidateArmyObj(trio, res.skills);
      D.formations.forEach(f => {
        const freshPair = () => {
          const mine = units.map((u, idx) => {
            const g = generalById[u.generalId];
            const sk = [u.skill1Id, u.skill2Id].map(id => id ? skillById[id] : null).filter(Boolean);
            return E.buildUnit(g, sk, uniqueByGeneralName[g.name], f, u.position, 'A', idx);
          });
          E.applyFormationEffects(mine); E.applyTeamCompositionBonuses(mine); E.applyBondBonuses(mine, BONDS); E.applyLoadoutSynergies(mine);
          return [mine, tierDeckToUnits(td, 'B')];
        };
        const m = E.runMonteCarlo(freshPair, state.sim.coeffs, 6);
        if (!best || m.winRateA > best.wr) best = { trio, units, wr: m.winRateA, formation: f };
      });
    });
    if (!best) { wrap.appendChild(el('div', { class: 'empty-note' }, ['카운터 덱을 찾지 못했습니다.'])); return wrap; }

    const names = best.trio.map(g => g.name);
    const bonds = findActiveBonds(names).filter(b => b.simulatable);
    const head = el('div', { class: 'counter-item counter-deck-head' }, [
      el('div', { class: 'counter-skill' }, [`${names.join(' + ')} — 진형 [${best.formation.name}] · 예상 승률 ${fmtPct(best.wr)}`]),
      el('div', { class: 'counter-reason' }, [
        `상대 [${td.name}]에게만 맞춰 시뮬레이션한 결과입니다. `,
        bonds.length ? `활성 인연: ${bonds.map(b => b.name).join(', ')}. ` : '',
        `상대 특징(${r.counter.profile.tags.map(t => t.tag).join(', ') || '없음'})을 고려해 역할이 맞는 조합을 골랐습니다.`,
      ]),
    ]);
    wrap.appendChild(head);
    best.units.forEach(u => {
      const g = generalById[u.generalId];
      const s1 = u.skill1Id ? skillById[u.skill1Id] : null;
      const s2 = u.skill2Id ? skillById[u.skill2Id] : null;
      const prefer = preferredSkillsFor(g.name);
      const why = [s1, s2].filter(Boolean).map(s =>
        prefer.includes(s.name) ? `${s.name}(티어덱 검증 조합)` : `${s.name}(${s.trait} 역할 보강)`).join(' / ');
      wrap.appendChild(el('div', { class: 'counter-item counter-deck-unit' }, [
        el('div', { class: 'counter-skill' }, [`${g.name} [${g.country}·${g.role}·${u.position === 'back' ? '후열' : '전열'}]`]),
        el('div', { class: 'counter-reason' }, [why || '전법 없음']),
      ]));
    });
    return wrap;
  }

  function summaryCard(label, value, sub) {
    return el('div', { class: 'summary-card' }, [
      el('div', { class: 'sc-value' }, [value]),
      el('div', { class: 'sc-label' }, [label]),
      sub ? el('div', { class: 'sc-sub' }, [sub]) : null,
    ]);
  }
  function sectionTitle(t, sub) {
    return el('div', { class: 'section-title' }, [el('h3', null, [t]), el('span', { class: 'section-sub' }, [sub])]);
  }

  // ---------------- 차트 (값 상시 표기) ----------------
  function barChart(items, diverging) {
    const wrap = el('div', { class: 'barchart' });
    if (!items.length) { wrap.appendChild(el('div', { class: 'empty-note' }, ['데이터 없음'])); return wrap; }
    const maxAbs = Math.max(...items.map(i => Math.abs(i.value)), 0.0001);
    items.forEach(i => {
      const pct = Math.min(100, Math.abs(i.value) / maxAbs * 100);
      const row = el('div', { class: 'bar-row' }, [
        el('div', { class: 'bar-label' }, [i.label]),
        el('div', { class: 'bar-track' }, [
          el('div', { class: 'bar-fill' + (diverging && i.value < 0 ? ' negative' : ''), style: `width:${pct}%` }),
        ]),
        el('div', { class: 'bar-value' }, [i.display]),
      ]);
      wrap.appendChild(row);
    });
    return wrap;
  }

  function lineChart(curve, decisiveTurn) {
    const W = 640, H = 220, PAD = 36;
    if (!curve.length) return el('div', { class: 'empty-note' }, ['데이터 없음']);
    const maxV = Math.max(...curve.flatMap(p => [p.A, p.B]));
    const x = t => PAD + (t - 1) / Math.max(1, (curve[curve.length - 1].turn - 1)) * (W - PAD * 2);
    const y = v => H - PAD - (v / maxV) * (H - PAD * 2);
    function pathOf(key) { return curve.map((p, i) => `${i === 0 ? 'M' : 'L'} ${x(p.turn)} ${y(p[key])}`).join(' '); }
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('class', 'linechart-svg');

    function addPath(d, cls) { const p = document.createElementNS(svgNS, 'path'); p.setAttribute('d', d); p.setAttribute('class', cls); svg.appendChild(p); }
    addPath(pathOf('A'), 'line-a');
    addPath(pathOf('B'), 'line-b');

    curve.forEach(p => {
      [['A', p.A], ['B', p.B]].forEach(([side, v]) => {
        const cx = x(p.turn), cy = y(v);
        const c = document.createElementNS(svgNS, 'circle');
        c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', 3);
        c.setAttribute('class', side === 'A' ? 'dot-a' : 'dot-b');
        svg.appendChild(c);
        const t = document.createElementNS(svgNS, 'text');
        t.setAttribute('x', cx); t.setAttribute('y', side === 'A' ? cy - 8 : cy + 16);
        t.setAttribute('class', 'line-label ' + (side === 'A' ? 'label-a' : 'label-b'));
        t.textContent = Math.round(v);
        svg.appendChild(t);
      });
      const xt = document.createElementNS(svgNS, 'text');
      xt.setAttribute('x', x(p.turn)); xt.setAttribute('y', H - 8);
      xt.setAttribute('class', 'axis-label'); xt.textContent = p.turn + '턴';
      svg.appendChild(xt);
    });
    if (decisiveTurn) {
      const dp = curve.find(p => p.turn === decisiveTurn);
      if (dp) {
        const lx = x(decisiveTurn);
        const vline = document.createElementNS(svgNS, 'line');
        vline.setAttribute('x1', lx); vline.setAttribute('x2', lx);
        vline.setAttribute('y1', PAD - 10); vline.setAttribute('y2', H - PAD);
        vline.setAttribute('class', 'decisive-line');
        svg.appendChild(vline);
      }
    }
    const legend = el('div', { class: 'chart-legend' }, [
      el('span', { class: 'legend-a' }, ['■ 내 부대']),
      el('span', { class: 'legend-b' }, ['■ 상대']),
    ]);
    const wrap = el('div', { class: 'linechart-wrap' }, [legend]);
    wrap.appendChild(svg);
    return wrap;
  }

  // ---------------- 프롬프트 생성 ----------------
  function copyPrompt(r) {
    const { mc, counter, army, td } = r;
    const armyFormation = formationById[army.formationId];
    const myLines = army.units.filter(Boolean).map(u => {
      const g = generalById[u.generalId];
      const s1 = u.skill1Id ? skillById[u.skill1Id].name : '-';
      const s2 = u.skill2Id ? skillById[u.skill2Id].name : '-';
      return `  - ${g.name} (${u.position === 'back' ? '후열' : '전열'}) — 전법: ${s1} / ${s2}`;
    }).join('\n');
    const oppLines = td.units.map(u => `  - ${u.general} — 전법: ${u.skill1} / ${u.skill2}`).join('\n');
    const factorLines = mc.decisiveFactors.slice(0, 3).map(f => `  - ${f.name} 3턴 내 발동 → ${fmtPp(f.delta)}`).join('\n');
    const contribLines = mc.contribution.slice(0, 5).map(c => `${c.name} ${fmtPct(c.pct)}`).join(' · ');
    const unusedList = counter.recommendations.map(r2 => r2.skill).join(', ') || '(추천 없음)';

    const text = `[천하결전 덱 파훼 분석 요청]

■ 내 덱
${myLines}
  (진형: ${armyFormation ? armyFormation.name : '-'})

■ 상대 (${td.name})
${oppLines}

■ 시뮬 결과 (${mc.runs}판, 근사 계수 C=${state.sim.coeffs.C}/α=${state.sim.coeffs.alpha})
  승률 ${fmtPct(mc.winRateA)} (${mc.winA}승 ${mc.winB}패) · 평균 종료 ${mc.avgTurns.toFixed(1)}턴 · 결정적 턴 ${mc.decisiveTurn || '-'}턴

■ 승패 갈림 요인
${factorLines || '  - (충분한 표본 없음)'}

■ 상대 덱 특징
  ${counter.profile.tags.map(t => t.tag).join(', ') || '뚜렷한 편향 없음'} · 물리 비중 ${fmtPct(counter.profile.physRatio)}

■ 내 전법 기여도
  ${contribLines}

■ 내 보유 중 미사용 전법 (추천 후보)
  ${unusedList}

→ 이 상대를 파훼할 전법/무장 조합을 제안해줘.
   시뮬 계수가 근사값이라 절대 수치보다 구조적 취약점 위주로 봐줘.`;

    navigator.clipboard.writeText(text).then(() => {
      showToast('프롬프트가 클립보드에 복사되었습니다. Claude 채팅에 붙여넣어 이어서 분석해보세요.');
    }).catch(() => {
      showToast('클립보드 복사에 실패했습니다. 아래 텍스트를 직접 선택해 복사해주세요.');
      const ta = el('textarea', { class: 'fallback-copy', readonly: true }, []);
      ta.value = text;
      document.getElementById('sim-results').appendChild(ta);
      ta.select();
    });
  }
  function showToast(msg) {
    let t = document.getElementById('toast');
    if (!t) { t = el('div', { id: 'toast' }); document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 3200);
  }

  // ---------------- 초기화 ----------------
  // 헤더에 내보내기/불러오기 버튼 주입 (파일 버전이 바뀌어도 보유현황을 그대로 옮기기 위함)
  function mountDataButtons() {
    const header = document.querySelector('.app-header');
    if (!header || document.getElementById('data-actions')) return;
    const wrap = el('div', { id: 'data-actions' }, [
      el('span', { class: 'store-mode' }, [store.mode === 'artifact' ? '자동저장' : '자동저장(브라우저)']),
      el('button', { class: 'btn-ghost', onclick: exportUserData }, ['내보내기']),
      el('button', { class: 'btn-ghost', onclick: importUserData }, ['불러오기']),
    ]);
    const indicator = document.getElementById('save-indicator');
    if (indicator && indicator.parentNode === header) header.insertBefore(wrap, indicator);
    else header.appendChild(wrap);
  }

  async function init() {
    await loadUserData();
    document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => { state.activeTab = b.dataset.tab; render(); }));
    mountDataButtons();
    render();
  }
  init();
})();

</script>
